# -Pfast must compile without Error Prone and NullAway. The first invocation
# proves NullAway rejects the null; the second must then build green, which also
# shows that dropping the Error Prone arguments leaves javac working.
invoker.goals.1 = verify
invoker.buildResult.1 = failure
invoker.goals.2 = -Pfast verify
invoker.buildResult.2 = success
