# -Pfast must neither compile nor run tests. The first invocation proves the test
# fails; the second, with nothing but -Pfast, must then build green. It also
# relies on the default goal, since it names none.
invoker.goals.1 = verify
invoker.buildResult.1 = failure
invoker.goals.2 = -Pfast
invoker.buildResult.2 = success
