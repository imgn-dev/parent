# A child that depends on gaia sets javadoc.gaia.link, and its javadoc links
# gaia's types to gaia's published API documentation; verify.groovy reads the
# generated HTML. javadoc-extra-args covers the empty default, which links
# nothing. A modular project, as gaia's documentation is: javadoc warns when
# unnamed-module code links to named modules. package first, so that javadoc
# sees the compiled module descriptor.
invoker.goals = package javadoc:jar
invoker.buildResult = success
