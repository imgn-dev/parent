# A release always gets the full build, so -Prelease must refuse -Pfast. The
# first invocation is the same command without -Pfast and must succeed, so the
# failure of the second comes from -Pfast alone. skip.release.enforcement keeps
# the snapshot parent from failing both.
invoker.goals.1 = -Prelease -Dskip.release.enforcement=true validate
invoker.buildResult.1 = success
invoker.goals.2 = -Prelease -Pfast -Dskip.release.enforcement=true validate
invoker.buildResult.2 = failure
