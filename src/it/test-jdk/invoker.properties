# -Dtest.jdk must make surefire run the tests on the toolchain of that version.
# prebuild.groovy declares the running JDK under a made-up version, so only the
# toolchain lookup can find it; verify.groovy checks surefire used it.
invoker.goals = -t toolchains.xml -Dtest.jdk=imgn-it verify
invoker.buildResult = success
